interpreter: python3
# JSON configuration validation: .github/workflows/test.yml, Validate hook configuration
# Shell syntax validation: .github/workflows/test.yml, Validate shell syntax
# JavaScript syntax validation: .github/workflows/test.yml, Validate landing-page JavaScript syntax
# Regression tests: .github/workflows/test.yml, Run regression contracts
check: python -m json.tool hooks/hooks.json >/dev/null && bash -n hooks/scripts/*.sh && sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' | node --check - && python -m unittest discover -s tests -v
